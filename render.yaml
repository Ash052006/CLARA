services:
  - type: web
    name: clara-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: clara-db
          property: connectionString
      - key: MEMORY_BACKEND
        value: database
      - key: AUTH_ENABLED
        value: "true"
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: AUTH_REFRESH_TOKEN_DAYS
        value: "7"
      - key: DEMO_MODE
        value: "true"
      - key: VOICE_ENABLED
        value: "false"
      - key: INTENT_CLASSIFIER_ENABLED
        value: "false"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GMAIL_TOKEN_JSON
        sync: false
      - key: GOOGLE_CALENDAR_TOKEN_JSON
        sync: false
      - key: GOOGLE_OAUTH_INTERACTIVE
        value: "false"
      - key: CLARA_WARMUP
        value: "false"

databases:
  - name: clara-db
    plan: free
    databaseName: clara
    user: clara
